<!-- Burger Menu Overlay -->
<div class="menu-overlay" id="menuOverlay"></div>

<!-- Menu Content -->
<div class="menu-sidebar" id="menuSidebar">
    <div class="menu-header">
        <h3 class="menu-title">MENU</h3>
        <button class="menu-close-btn" id="menuCloseBtn" aria-label="Fermer le menu de navigation">
            <i data-lucide="x" aria-hidden="true"></i>
        </button>
    </div>

    <nav class="menu-nav" aria-label="Navigation principale">
        <button class="menu-item {{ 'active' if active_view == 'dashboard' else '' }}" onclick="window.location.href='/dashboard'">
            <i data-lucide="trending-up" aria-hidden="true"></i>
            Dashboard
        </button>
        <button class="menu-item {{ 'active' if active_view == 'session' else '' }}" onclick="window.location.href='/session'">
            <i data-lucide="play-circle" aria-hidden="true"></i>
                Apprentissage
        </button>
        <button class="menu-item {{ 'active' if active_view == 'cards' else '' }}" onclick="window.location.href='/cards-list'">
            <i data-lucide="book-open" aria-hidden="true"></i>
            Mes cartes
        </button>
        <button class="menu-item {{ 'active' if active_view == 'quiz' else '' }}" onclick="window.location.href='/quizzes-list'">
            <i data-lucide="target" aria-hidden="true"></i>
            Mes quizz
        </button>
    </nav>

    <div class="menu-footer">
        <button class="menu-logout" id="logoutBtn">
            <i data-lucide="log-out"></i>
            Déconnexion
        </button>
    </div>
</div>
