databases:
  - name: smartcard-db
    databaseName: smartcard
    user: smartcard
    plan: free

services:
  - type: web
    name: smartcard-backend
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartcard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # À renseigner manuellement dans le dashboard Render (clé Groq)
      - key: GROQ_API_KEY
        sync: false
      # À mettre à jour après le premier déploiement du frontend
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000"

  - type: web
    name: smartcard-frontend
    runtime: docker
    dockerfilePath: ./Frontend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # À mettre à jour après le premier déploiement du backend
      - key: BACKEND_URL
        value: "http://localhost:8000"
