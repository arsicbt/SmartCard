databases:
  - name: smartcard-db
    databaseName: smartcard
    user: smartcard
    plan: free

services:
  - type: web
    # renommer le service pour correspondre exactement à l'URL attribuée par Render
    name: smartcard-backend-sbpl
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartcard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        # L'URL exacte de mon Frontend
        value: "https://smartcard-frontend.onrender.com"

  - type: web
    name: smartcard-frontend
    runtime: docker
    dockerfilePath: ./Frontend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_URL
        # L'URL exacte de mon Backend
        value: "https://smartcard-backend-sbpl.onrender.com"
